name: Scrape and normalize validation data

# Runs from GitHub's own runners, which have normal outbound internet access
# -- unlike this repo's day-to-day development environment, where
# nf-validation.afnor.org, members.aoac.org and nen.bettywebblocks.com are
# all proxy-blocked. That means every live-fetch code path exercised here
# (NF-Validation organism pages, summary-report downloads, the AOAC-RI
# listing scraper, and the MicroVal fetch) had never run before this
# workflow's own first attempts against each site. Watch new runs for
# regressions: the "Upload debug dumps" step always runs (even on failure)
# so a raw-HTML/screenshot/JSON capture is available to diagnose from
# without needing another manual file handoff.
#
# Status per source as of the runs that got this workflow to green:
#   - NF-Validation: live-fetch + merge worked correctly from the first run.
#   - MicroVal: started as pure reconnaissance (no real sample had ever been
#     available to develop against) but its first two real runs revealed a
#     genuine server-rendered DataTables <table> with a consistent 6-column
#     layout on both target pages -- normalize_microval.py now maps it into
#     the canonical schema for real, no longer just dumping unmapped rows.
#   - AOAC-RI: still unresolved. The listing page (an ASP.NET/Sitefinity
#     site) renders fine but exposes 0 static PDF links -- certificate
#     downloads go through a hidden-field + postback JS mechanism
#     (Asi_WebRoot_AsiCommon_ContentManagement_DownloadDocument), not plain
#     <a href="*.pdf">, so aoac_ptm_live_fetch.py's simple GET-and-regex
#     approach cannot see them. Needs a Playwright-driven rewrite (interact
#     with the search/grid like microval_live_fetch.py does) to actually
#     trigger downloads -- not yet built.
#
# Deliberately NOT re-scraping the NF-Validation certificate-list PDF here:
# per the project's data-provenance policy, that PDF is a one-time bootstrap
# seed of unknown refresh cadence, not a recurring source. Only the live
# organism pages (which state their own last-updated date) and the summary
# report PDFs they link to are re-fetched.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-and-normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pypdf beautifulsoup4 jsonschema requests playwright cryptography

      - name: Install Playwright Chromium (for MicroVal)
        run: playwright install --with-deps chromium

      - name: Re-fetch live NF-Validation organism pages
        continue-on-error: true
        run: python3 scrapers/nf_validation_organism_pages.py --fetch-live --out-dir data/nf_validation_organism_pages

      - name: Re-run NF-Validation merge/normalization
        run: python3 pipeline/normalize_nf_validation.py

      - name: Fetch and mine summary validation reports
        continue-on-error: true
        run: python3 pipeline/fetch_and_mine_summary_reports.py --skip-already-mined

      - name: Fetch AOAC-RI live certificates
        continue-on-error: true
        run: python3 scrapers/aoac_ptm_live_fetch.py --out-dir data/aoac_ptm --debug-dir debug/aoac

      - name: Re-run AOAC-RI normalization
        run: python3 pipeline/normalize_aoac.py

      - name: MicroVal live fetch
        continue-on-error: true
        run: python3 scrapers/microval_live_fetch.py --out-dir data/microval --debug-dir debug/microval

      - name: Re-run MicroVal normalization
        run: python3 pipeline/normalize_microval.py

      - name: Rebuild frontend data
        run: python3 pipeline/build_frontend_data.py

      - name: Print debug summaries to the log
        # Belt-and-braces alongside the artifact upload below: artifact ZIPs
        # are only fetchable from a normal-egress network, which this
        # project's own review environment does not have either (same proxy
        # block as the sites themselves) -- so the first-run diagnosis
        # actually happened by reading this step's output via the GitHub API
        # instead. Keeping it means every future run stays diagnosable the
        # same way, without needing the artifact at all.
        if: always()
        run: |
          shopt -s nullglob
          echo "===================== AOAC debug ====================="
          for f in debug/aoac/*.html; do
            echo "--- $f ($(wc -l < "$f") lines) ---"
            echo "-- head --"
            head -n 40 "$f"
            echo "-- lines mentioning pdf/download/href (context 2), first 150 --"
            grep -inE 'pdf|download|href=' "$f" -A2 -B2 | head -n 150
            echo
          done
          echo "===================== MicroVal debug ====================="
          for f in debug/microval/*_json_responses.json; do
            echo "--- $f ---"
            cat "$f"
            echo
          done
          for f in debug/microval/*.html; do
            echo "--- $f ($(wc -l < "$f") lines) ---"
            head -n 80 "$f"
            echo
          done

      - name: Upload debug dumps (HTML / screenshots / captured JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug-dumps
          path: debug/
          retention-days: 14
          if-no-files-found: ignore

      - name: Open a pull request with any changes
        id: create_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Scheduled validation-data scrape and normalization"
          title: "Scheduled data update: NF-Validation / AOAC-RI / MicroVal"
          body: |
            Automated run of the NF-Validation live-page scraper, the
            certificate/organism-page merge pipeline, the summary-report
            performance-data miner, the AOAC-RI live listing scraper, and
            the MicroVal live fetch + normalization.

            Review the diff before merging. If a source came back empty or
            looks wrong, check the "scrape-debug-dumps" workflow artifact
            (raw HTML, screenshots, and any captured JSON API responses)
            before assuming the site has no new data -- AOAC-RI in
            particular is known to still return 0 certificates (its
            downloads go through a JS postback mechanism a plain GET can't
            trigger; see the workflow file's header comment).
          branch: automated/validation-data-scrape
          delete-branch: true

      - name: Note if automatic PR creation was blocked
        if: steps.create_pr.outcome == 'failure'
        run: |
          echo "::warning::Automatic PR creation failed. This is almost always the repo setting"
          echo "Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions"
          echo "to create and approve pull requests' being off -- enable it so future runs can"
          echo "open the PR themselves. The commit itself was still pushed to the"
          echo "'automated/validation-data-scrape' branch; open a PR from it manually for now."
