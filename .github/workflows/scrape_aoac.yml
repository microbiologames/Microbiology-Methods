name: Scrape and normalize AOAC-RI data

# Split out from a single combined workflow (see git history) specifically
# so this source could be iterated on cheaply: AOAC-RI is currently the
# broken one, and re-running the whole combined job (dominated by AFNOR's
# ~40-minute summary-report mining step) for every debugging attempt here
# wasted most of that time. Runs from GitHub's own runners, which have
# normal outbound internet access -- unlike this repo's day-to-day
# development environment, where members.aoac.org is proxy-blocked.
#
# Status: CONFIRMED BROKEN ON AOAC'S OWN SIDE, not a scraper problem --
# further automated iteration here won't fix it. The listing page
# (https://members.aoac.org/AOAC/AOAC/RI/PTM_Validated_Methods.aspx, an
# ASP.NET/iMIS page) responds fine and its results area is a genuine
# search widget (not login-gated or empty-by-design): selecting a real
# filter (Discipline=Microbiological, confirmed to register in the DOM)
# and clicking "Find" still never reaches the server. The captured
# pageerror stack trace shows why: Telerik.Web.UI.RadAjaxManager.
# _applyUpdatePanelsRenderMode throws "Cannot read properties of null
# (reading 'length')" during the page's own Sys.Application.
# _doInitialize(), which crashes before __doPostBack ever gets defined
# (confirmed to still be undefined after an explicit 10-second wait --
# not a load-order race). That's consistent with RadAjaxManager being
# configured to reference an UpdatePanel/container that doesn't exist in
# this page's current markup -- a server-side misconfiguration on AOAC's
# end that would break the "Find" button for any real browser, not
# something browser-automation can click around. scrapers/
# aoac_ptm_live_fetch.py's headless-Chromium fallback still performs the
# full attempt (select Microbiological, click Find, capture before/after
# HTML/screenshots/console errors) each run, so this will self-correct
# the moment AOAC fixes their page -- no code change needed here for
# that, just watch the debug dump's console-error capture for the day it
# comes back empty.

on:
  schedule:
    - cron: "30 6 * * *"  # daily, 06:30 UTC (staggered from the other two workflows)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-aoac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pypdf beautifulsoup4 jsonschema requests playwright

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Fetch AOAC-RI live certificates
        continue-on-error: true
        run: python3 scrapers/aoac_ptm_live_fetch.py --out-dir data/aoac_ptm --debug-dir debug/aoac

      - name: Re-run AOAC-RI normalization
        run: python3 pipeline/normalize_aoac.py

      - name: Rebuild frontend data
        run: python3 pipeline/build_frontend_data.py

      - name: Print debug summary to the log
        # Belt-and-braces alongside the artifact upload below: artifact ZIPs
        # are only fetchable from a normal-egress network, which this
        # project's own review environment does not have either (same proxy
        # block as the site itself) -- so diagnosis so far has happened by
        # reading this step's output via the GitHub API instead.
        #
        # A run confirmed the plain-GET-vs-Playwright-rendered HTML are
        # identical (0 real result rows either way, just the download
        # postback plumbing) -- a raw grep for pdf/download/href only ever
        # showed that same plumbing and nothing about *why* the results area
        # is empty. This step now uses BeautifulSoup to print the actual
        # structure around any element whose id/class hints at being the
        # results container (Content/List/Grid/Result/Search/Method), since
        # that's the part a keyword grep can't see when the container has no
        # matching text yet.
        if: always()
        run: |
          shopt -s nullglob
          for f in debug/aoac/*.html; do
            echo "--- $f ($(wc -l < "$f") lines, $(wc -c < "$f") bytes) ---"
            python3 - "$f" <<'PYEOF'
          import sys
          from bs4 import BeautifulSoup

          path = sys.argv[1]
          html = open(path, encoding="utf-8", errors="ignore").read()
          soup = BeautifulSoup(html, "html.parser")

          print("-- title --")
          print(soup.title.get_text(strip=True) if soup.title else "(none)")

          print("-- body visible text (collapsed whitespace, first 2000 chars) --")
          text = " ".join(soup.get_text(" ", strip=True).split())
          print(text[:2000])

          print("-- elements whose id/class hints at being the results area --")
          import re
          pattern = re.compile(r'content|list|grid|result|search|method|rlv|rad', re.I)
          seen = set()
          for el in soup.find_all(id=pattern):
              if el.get("id") in seen:
                  continue
              seen.add(el.get("id"))
              children = len(el.find_all())
              own_text = " ".join(el.get_text(" ", strip=True).split())[:200]
              print(f"  id={el.get('id')!r} tag={el.name} class={el.get('class')} "
                    f"descendant_count={children} text={own_text!r}")

          print("-- all <form>/<select>/<input> elements (name, type, value) --")
          for el in soup.find_all(["form", "select", "input", "button"]):
              attrs = {k: el.get(k) for k in ("id", "name", "type", "value") if el.get(k)}
              print(f"  <{el.name}> {attrs}")
          PYEOF
            echo
          done
          for f in debug/aoac/rendered_listing_rows.json debug/aoac/rendered_listing_network_log.json; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
            echo
          done

      - name: Upload debug dumps (HTML / screenshot / captured JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aoac-debug-dumps
          path: debug/
          retention-days: 14
          if-no-files-found: ignore

      - name: Open a pull request with any changes
        id: create_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Scheduled AOAC-RI scrape and normalization"
          title: "Scheduled data update: AOAC-RI"
          body: |
            Automated run of the AOAC-RI live listing scraper and
            normalization.

            This source is confirmed broken on AOAC's own side (see the
            workflow file's header comment for the full stack trace) --
            their search widget's "Find" button never reaches the server
            because their page's own Telerik RadAjaxManager crashes
            during initialization, before __doPostBack gets defined.
            Expect 0 new certificates until AOAC fixes this; check the
            "aoac-debug-dumps" workflow artifact / this run's log
            (console error/pageerror capture) for a run where that crash
            no longer appears before assuming otherwise.
          branch: automated/aoac-scrape
          delete-branch: true

      - name: Note if automatic PR creation was blocked
        if: steps.create_pr.outcome == 'failure'
        run: |
          echo "::warning::Automatic PR creation failed. This is almost always the repo setting"
          echo "Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions"
          echo "to create and approve pull requests' being off -- enable it so future runs can"
          echo "open the PR themselves. The commit itself was still pushed to the"
          echo "'automated/aoac-scrape' branch; open a PR from it manually for now."
