name: Debug -- dump summary report text

# Temporary, manual-only diagnostic tool: fetches a fixed set of real
# summary-report PDFs and prints their raw extracted text to the job log, so
# scrapers/summary_report_parser.py's category-extraction regexes can be
# widened against real report wording instead of guessed at. Not part of the
# regular data pipeline -- delete once that widening work is done.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pypdf requests cryptography

      - name: Dump qualitative report (VIDAS Salmonella) -- skip front matter/TOC
        # The first run's 12000-char cap only reached page ~8 of 97 -- the
        # actual "3.1.1 Sensitivity study" / "3.1.4 Inclusivity/exclusivity"
        # sections (per its own table of contents) start around page 10.
        run: |
          python3 scrapers/debug_dump_report_text.py --out-dir debug/reports --skip-chars 10000 --max-chars 50000 \
            "https://nf-validation.afnor.org/wp-content/uploads/2026/08/VIDAS-Salmonella-Dual-SUMMARY-REPORT-Version-0.pdf"
          mv debug/reports/report_0.txt debug/reports/qualitative_vidas_salmonella.txt

      - name: Print qualitative dump
        run: |
          f=debug/reports/qualitative_vidas_salmonella.txt
          echo "=================== $f ($(wc -c < "$f") bytes) ==================="
          cat "$f"

      - name: Dump quantitative report (Petrifilm RCC) -- skip front matter/TOC
        # Same reasoning: its own TOC puts "3.1.1.3 Results" / "3.1.1.4
        # Statistical interpretation" (where the Category/SD/Bias table this
        # project's regex looks for should be) around pages 10-15 of 99.
        run: |
          python3 scrapers/debug_dump_report_text.py --out-dir debug/reports --skip-chars 8000 --max-chars 50000 \
            "https://nf-validation.afnor.org/wp-content/uploads/2026/05/Petrifilm_RCC_SR_05_25_v0-protected.pdf"
          mv debug/reports/report_0.txt debug/reports/quantitative_petrifilm_rcc.txt

      - name: Print quantitative dump
        run: |
          f=debug/reports/quantitative_petrifilm_rcc.txt
          echo "=================== $f ($(wc -c < "$f") bytes) ==================="
          cat "$f"
