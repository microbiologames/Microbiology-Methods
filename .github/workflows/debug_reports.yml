name: Debug -- dump summary report tables

# Temporary, manual-only diagnostic tool. The linear-text regex approach in
# scrapers/summary_report_parser.py was confirmed (by an earlier version of
# this same workflow, see git history) to fail on most real reports: each
# expert laboratory phrases its category-breakdown table header differently,
# and at least one uses a garbled Unicode symbol for "D-bar (bias)" that
# defeats simple text matching entirely. Rebuilding this on pdfplumber's
# structural table extraction (real cell grid, from visual layout, not
# wording) instead -- this workflow dumps that structure for two real
# reports (one qualitative, one quantitative) so the next iteration can be
# built against real cell boundaries. Not part of the regular data pipeline
# -- delete once that rewrite is done.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber requests cryptography

      - name: Dump qualitative report tables (VIDAS Salmonella, pages 13-17)
        # Table 3 / Table 4 (the method-comparison-by-category tables) were
        # found around printed pages 13-16 in the linear-text dump.
        run: |
          python3 scrapers/debug_dump_tables.py --first-page 13 --last-page 17 \
            "https://nf-validation.afnor.org/wp-content/uploads/2026/08/VIDAS-Salmonella-Dual-SUMMARY-REPORT-Version-0.pdf"

      - name: Dump quantitative report tables (Petrifilm RCC, pages 20-23)
        # Table 6 (the relative-trueness-by-category table, 3 sub-tables for
        # the report's 3 related certificates) was found around printed
        # page 21 in the linear-text dump.
        run: |
          python3 scrapers/debug_dump_tables.py --first-page 20 --last-page 23 \
            "https://nf-validation.afnor.org/wp-content/uploads/2026/05/Petrifilm_RCC_SR_05_25_v0-protected.pdf"
